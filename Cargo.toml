[workspace]
members = [
    "crates/arinc429-core",
    "crates/firmware",
    "crates/pico429",
]
default-members = ["crates/pico429"]
resolver = "2"

# -----------------------------------------------------------------------------
# 1. 调试与开发 Profile (针对日常迭代、单步调试与快速验证优化)
# -----------------------------------------------------------------------------
[profile.dev]
opt-level = 1               # 开启基础指令级优化，防止未优化的 Embassy 状态机/时钟堆积膨胀
debug = 2                   # 完整保留 DWARF 调试符号与行号信息，供 probe-rs 和 GDB 单步调试
debug-assertions = true     # 保留运行时溢出与切片越界安全断言
overflow-checks = true      # 开启数学运算溢出拦截
codegen-units = 256         # 多核并行分片编译，大幅缩短单次编译耗时
incremental = true          # 开启增量编译缓存，二次构建秒级完成

# -----------------------------------------------------------------------------
# 2. 依赖项编译缓存加速策略 (针对第三方依赖进行高级优化与缓存固化)
# -----------------------------------------------------------------------------
# 对所有第三方外部依赖库 (如 embassy-rp, cyw43, smoltcp, cortex-m 等) 启用高效优化
# 这样第三方大库在首次构建后被作为优化产物永久缓存，后续业务代码修改重编译时，
# 只需重编译自身极少量的代码并快速链接，避免每次受庞大的网络栈拖慢！
[profile.dev.package."*"]
opt-level = 2

# 强制宿主机编译期构建脚本与过程宏使用 opt-level = 0 极速构建，跳过 PC 端无意义的深度优化
# 注意：此项仅约束在开发机 (Windows) 上执行的临时宏工具，绝不影响单片机 Flash 固件库 (保持 opt-level = 2)
[profile.dev.build-override]
opt-level = 0

# -----------------------------------------------------------------------------
# 3. 发布 Profile (针对嵌入式固件 Flash 极致精简与高吞吐执行优化)
# -----------------------------------------------------------------------------
[profile.release]
opt-level = "s"             # 优化代码尺寸 (Size)，最大限度收敛 Flash 占用；如需极限吞吐亦可换 3
lto = "fat"                 # 启用全程序全局链接时优化 (Full Fat LTO)，彻底穿透并消除跨 crate 死代码
codegen-units = 1           # 聚合为单一代码生成单元，为 LLVM 跨函数全程序内联与死代码剔除提供最大上下文
panic = "abort"             # 禁用栈展开 (Unwind)，移除冗余的 landing pad 代码与异常表
debug = 2                   # 关键：保留 ELF 调试信息供 defmt 提取日志字典与上位机堆栈回溯（不烧入 Flash）
strip = false               # 不剥离符号表，确保 probe-rs / defmt-print 能够正常还原日志

# 上位机 Rust 宿主执行端：启用最高速度优化以支撑 533 KB/s 全载荷吞吐
[profile.release.package.pico429]
opt-level = 3
