[package]
name = "pico-429-firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-sync = { version = "0.8.0" }
embassy-futures = "0.1.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "1.2"
defmt-rtt = "1.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }

pio = "0.3.0"
pio-proc = "0.3.0"
fixed = "1.31"
static_cell = "2.1"

arinc429-core = { path = "../arinc429-core", features = ["defmt"] }
