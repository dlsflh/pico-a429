[package]
name = "pico429"
version = "0.1.0"
edition = "2024"
authors = ["ARINC 429 pico-429 developers"]
description = "Pure Rust high-throughput host streaming engine and native Model Context Protocol (MCP) server for Pico-429"
license = "MIT"

[dependencies]
arinc429-core = { path = "../arinc429-core" }
tokio = { version = "1.54", features = ["full"] }
tokio-util = "0.7"
serialport = "4.10"
clap = { version = "4.6", features = ["derive"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "=0.5.11"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"
uuid = { version = "1.29", features = ["v4"] }
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media"] }
